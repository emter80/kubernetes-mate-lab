apiVersion: apps/v1
kind: Deployment

metadata:
  name: notes-frontend
  namespace: notes

spec:
  replicas: 2

  selector:
    matchLabels:
      app: notes-frontend

  template:
    metadata:
      labels:
        app: notes-frontend

    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: frontend
          image: nginxinc/nginx-unprivileged:1.27-alpine

          ports:
            - containerPort: 8080

          readinessProbe:
            httpGet:
              path: /
              port: 8080

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi

          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: html
          configMap:
            name: notes-frontend-html
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service

metadata:
  name: notes-frontend
  namespace: notes

spec:
  selector:
    app: notes-frontend

  ports:
    - port: 80
      targetPort: 8080
