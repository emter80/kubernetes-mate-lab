service:
  type: ClusterIP

persistence:
  enabled: false

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-server.monitoring.svc.cluster.local
        isDefault: true

envValueFrom:
  GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
    secretKeyRef:
      name: grafana-oidc
      key: OIDC_CLIENT_SECRET

extraConfigmapMounts:
  - name: multipass-root-ca
    mountPath: /etc/ssl/certs/multipass-root-ca.crt
    subPath: ca.crt
    configMap: multipass-root-ca
    readOnly: true

grafana.ini:
  server:
    root_url: https://grafana.multipass.k3s
  auth.basic:
    enabled: false
  auth:
    disable_login_form: true
  auth.generic_oauth:
    enabled: true
    name: Dex
    allow_sign_up: true
    client_id: grafana
    client_secret: "$__env{GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}"
    scopes: openid profile email groups
    auth_url: https://dex.multipass.k3s/auth
    token_url: https://dex.multipass.k3s/token
    api_url: https://dex.multipass.k3s/userinfo
    use_pkce: true
    tls_client_ca: /etc/ssl/certs/multipass-root-ca.crt
    role_attribute_path: "'Editor'"
    role_attribute_strict: true
  auth.anonymous:
    enabled: false