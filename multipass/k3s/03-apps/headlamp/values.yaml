service:
  type: ClusterIP

config:
  inCluster: true

  oidc:
    externalSecret:
      enabled: true
      name: headlamp-oidc
      hasScopes: true

    callbackURL: https://headlamp.multipass.k3s/oidc-callback
    useCookie: true

env:
  - name: SSL_CERT_FILE
    value: /etc/ssl/certs/multipass-root-ca.crt

volumes:
  - name: dex-ca
    configMap:
      name: dex-ca

volumeMounts:
  - name: dex-ca
    mountPath: /etc/ssl/certs/multipass-root-ca.crt
    subPath: ca.crt
