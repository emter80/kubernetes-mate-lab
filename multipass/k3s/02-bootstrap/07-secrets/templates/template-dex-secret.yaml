apiVersion: v1
kind: Secret
metadata:
  name: dex-config
  namespace: dex
type: Opaque
stringData:
  config.yaml: |
    issuer: https://dex.multipass.k3s

    storage:
      type: kubernetes
      config:
        inCluster: true

    web:
      http: 0.0.0.0:5556

    oauth2:
      skipApprovalScreen: true

    connectors:
      - type: github
        id: github
        name: GitHub
        config:
          clientID: <client_id>
          clientSecret: <client_secret>
          redirectURI: https://dex.multipass.k3s/callback

    staticClients:
    # OIDC clients managed manually
    # Each application gets its own client
    #
      - id: kubernetes
        name: Kubernetes API
        secret: kubernetes-secret
        redirectURIs:
          - http://localhost
          - https://headlamp.multipass.k3s/oidc-callback
